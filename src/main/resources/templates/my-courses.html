
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registered Courses</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

    <div class="container">

        <h1>My Registered Courses</h1>

        <p>Here are the courses you have registered for:</p>

        <div th:if="${courses == null or #lists.isEmpty(courses)}">
            <p>You have not registered for any courses yet.</p>
        </div>

        <div th:unless="${courses == null or #lists.isEmpty(courses)}">

            <table>
                <thead>
                    <tr>
                        <th>Course ID</th>
                        <th>Course Name</th>
                        <th>Description</th>
                        <th>Credit Hours</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.id}"></td>
                        <td th:text="${course.name}"></td>
                        <td th:text="${course.description}"></td>
                        <td th:text="${course.creditHours}"></td>
                    </tr>
                </tbody>
            </table>

        </div>

        <br>

        <a href="/courses">Browse Available Courses</a>

        <br><br>

        <a href="/dashboard">Back to Dashboard</a>

        <br><br>

        <a href="/logout">Logout</a>

    </div>

</body>
</html>
